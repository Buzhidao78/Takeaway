# 生产环境配置
server:
  port: 8080

spring:
  web:
    resources:
      cache-period: 2592000  # ✅ 生产环境启用缓存 30 天
      add-mappings: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/bzy_takeaway?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:Prod@2024Root#Secure9527}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Redis@2024Secure#7788}
      database: 0
  servlet:
    multipart:
      max-file-size: 50MB  # ✅ 单文件最大 50MB
      max-request-size: 100MB  # ✅ 总请求最大 100MB
  compression:
    enabled: true  # ✅ 启用 Gzip 压缩
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
    min-response-size: 1024  # 大于 1KB 的响应才压缩

# 文件上传路径
file:
  upload-path: /app/uploads
  access-prefix: /uploads/**

# Alipay sandbox configuration
alipay:
  enabled: true
  app-id: 9021000158677959
  private-key: 
  alipay-public-key: 
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: http://8.138.37.105:8080/api/pay/alipay/notify
  return-url: http://8.138.37.105:8080/#/pay-result

# 阿里云短信
sms:
  access-key-id: 
  access-key-secret: 
  sign-name: 
  template-code: 
  dev-mode: true  # 修改为开发模式，使用万能验证码 123456

# JWT
jwt:
  secret: bzy-takeaway-jwt-secret-key-2024-very-long-secret
  expire-minutes: 1440

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.bzy: info
    org.springframework: warn
