# 开发环境配置
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  mvc:
    static-path-pattern: /static/**
  web:
    resources:
      cache-period: 0  # 开发环境禁用静态资源缓存
      static-locations: classpath:/static/
      mvc-throw-exception-if-no-handler-found: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bzy_takeaway?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 文件上传路径
file:
  upload-path: D:/git/code01/Project1/uploads
  access-prefix: /uploads/**

# Alipay sandbox configuration (disabled in dev, use mock payment)
alipay:
  enabled: false
#  app-id: 9021000158677959
#  private-key: 
#  alipay-public-key: 
#  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
#  notify-url: http://wbbd3ab9.natappfree.cc/api/pay/alipay/notify
#  return-url: http://wbbd3ab9.natappfree.cc/#/order/pay-result

# 阿里云短信
sms:
  access-key-id: 
  access-key-secret: 
  sign-name: 
  template-code: 
  dev-mode: true

# JWT
jwt:
  secret: bzy-takeaway-jwt-secret-key-2024-very-long-secret
  expire-minutes: 1440

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.bzy: debug
    org.springframework: info
    org.springframework.web: DEBUG
    org.springframework.web.servlet: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE
