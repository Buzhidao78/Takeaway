services:
  # MySQL 数据库（不向宿主暴露端口，仅容器网络内供 backend 访问）
  mysql:
    image: docker.1panel.live/library/mysql:8.0
    container_name: takeaway-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Prod@2024Root#Secure9527}
      MYSQL_DATABASE: bzy_takeaway
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - takeaway_mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Prod@2024Root#Secure9527}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存（不向宿主暴露端口）
  redis:
    image: docker.1panel.live/library/redis:alpine
    container_name: takeaway-redis
    restart: always
    volumes:
      - takeaway_redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-Redis@2024Secure#7788}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Redis@2024Secure#7788", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 Spring Boot API（宿主 8081 → 容器 8080）
  backend:
    image: takeaway-backend:v1
    container_name: takeaway-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=bzy_takeaway
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-Prod@2024Root#Secure9527}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-Redis@2024Secure#7788}
      - TZ=Asia/Shanghai
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端 Nginx（宿主 8091 → 容器 80，反代 /api、/uploads、/ws 到 backend）
  frontend:
    image: takeaway-frontend:v1
    container_name: takeaway-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8091:80"

volumes:
  takeaway_mysql_data:
  takeaway_redis_data: