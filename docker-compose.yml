services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: takeaway-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Prod@2024Root#Secure9527}
      MYSQL_DATABASE: bzy_takeaway
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Prod@2024Root#Secure9527}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:alpine
    container_name: takeaway-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass Redis@2024Secure#7788
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Redis@2024Secure#7788", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 Spring Boot (包含前端静态文件)
  backend:
    image: openjdk:17-slim
    container_name: takeaway-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=bzy_takeaway
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-Prod@2024Root#Secure9527}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-Redis@2024Secure#7788}
      - TZ=Asia/Shanghai
    volumes:
      - ./bzy-takeaway-1.0.0.jar:/app/app.jar
      - ./uploads:/app/uploads
      - ./config:/app/config
    ports:
      - "8080:8080"
    command: java -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Dspring.config.additional-location=/app/config/ -jar app.jar
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql-data:
  redis-data:
